# Builds ClaudeUsage-<version>.exe and publishes it as a GitHub release on every push to main
# whose version (in Cargo.toml) has no release yet. The tag v<version> is created
# automatically. Pushes that don't bump the version are skipped.
# To release: bump version in Cargo.toml, commit, push.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:  # run manually from the Actions tab

permissions:
  contents: write  # needed to create the tag and release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and skip if already released
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/^version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml | head -1)
          if [ -z "$ver" ]; then
            echo "No version found in Cargo.toml"
            exit 1
          fi
          echo "VER=$ver" >> "$GITHUB_ENV"
          if gh release view "v$ver" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then
            echo "v$ver already exists, nothing to release. Bump the version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$ver"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Test
        if: steps.ver.outputs.skip == 'false'
        run: cargo test --release

      - name: Build the exe
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        run: |
          cargo build --release
          mkdir -p "build/$VER"
          cp target/release/ClaudeUsage.exe "build/$VER/ClaudeUsage-$VER.exe"

      - name: Tag and publish the release
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VER" "build/$VER/ClaudeUsage-$VER.exe" \
            --target "$GITHUB_SHA" \
            --title "Claude Usage $VER" --generate-notes
