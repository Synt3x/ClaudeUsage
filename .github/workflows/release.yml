# Builds and tests on every push and pull request. On main, it also publishes
# ClaudeUsage-<version>.exe as a GitHub release when that version (in Cargo.toml)
# has no release yet; the tag v<version> is created automatically.
# To release: bump version in Cargo.toml, commit, push to main.
name: Build and release

on:
  push:
  pull_request:
  workflow_dispatch:  # run manually from the Actions tab (releases only on main)

permissions:
  contents: write  # needed to create the tag and release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and decide whether to release
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/^version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml | head -1)
          if [ -z "$ver" ]; then
            echo "No version found in Cargo.toml"
            exit 1
          fi
          echo "VER=$ver" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "Not on main: build and test only."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$ver" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then
            echo "v$ver already exists, nothing to release. Bump the version to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$ver"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build the exe
        shell: bash
        run: |
          cargo build --release
          mkdir -p "build/$VER"
          cp target/release/ClaudeUsage.exe "build/$VER/ClaudeUsage-$VER.exe"

      - name: Upload the exe (for testing builds that aren't released)
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsage-${{ env.VER }}
          path: build/${{ env.VER }}/ClaudeUsage-${{ env.VER }}.exe

      - name: Tag and publish the release
        if: steps.ver.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VER" "build/$VER/ClaudeUsage-$VER.exe" \
            --target "$GITHUB_SHA" \
            --title "Claude Usage $VER" --generate-notes
