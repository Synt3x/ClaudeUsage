# Builds ClaudeUsage-<version>.exe and publishes it as a GitHub release on every push to main
# whose __version__ (in claude_usage.pyw) has no release yet. The tag v<version> is
# created automatically. Pushes that don't bump __version__ are skipped.
# To release: bump __version__, commit, push.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:  # run manually from the Actions tab

permissions:
  contents: write  # needed to create the tag and release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read __version__ and skip if already released
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/^__version__ *= *"\([0-9.]*\)".*/\1/p' claude_usage.pyw)
          if [ -z "$ver" ]; then
            echo "No __version__ found in claude_usage.pyw"
            exit 1
          fi
          echo "VER=$ver" >> "$GITHUB_ENV"
          if gh release view "v$ver" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then
            echo "v$ver already exists, nothing to release. Bump __version__ to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$ver"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.skip == 'false'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.ver.outputs.skip == 'false'
        run: pip install -r requirements.txt pyinstaller

      - name: Build the exe
        if: steps.ver.outputs.skip == 'false'
        run: python build.py

      - name: Tag and publish the release
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VER" "build/$VER/ClaudeUsage-$VER.exe" \
            --target "$GITHUB_SHA" \
            --title "Claude Usage $VER" --generate-notes
