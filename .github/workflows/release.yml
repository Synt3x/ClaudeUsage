# Builds ClaudeUsage.exe and publishes it as a GitHub release when a version tag is pushed:
#   git tag v1.0.9 && git push origin v1.0.9
# The tag must match __version__ in claude_usage.pyw.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Check the tag matches __version__
        shell: bash
        run: |
          ver=$(python -c "import build; print(build.read_version())")
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match __version__ = $ver in claude_usage.pyw"
            exit 1
          fi
          echo "VER=$ver" >> "$GITHUB_ENV"

      - name: Build the exe
        run: python build.py

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/$VER/ClaudeUsage.exe" \
            --title "Claude Usage $VER" --generate-notes
